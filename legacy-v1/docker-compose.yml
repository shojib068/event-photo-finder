services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - wedding-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wedding']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wedding-db:
